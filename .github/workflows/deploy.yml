name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Turns on GitHub Pages (source: GitHub Actions) the first time, so a
      # fresh clone of this repo deploys without touching repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      # On the github.io project site the app lives under /midsouthlunar/.
      # When a custom domain (CNAME) is present, serve from the root instead.
      - name: Build
        env:
          # Optional AI mode for the chatbot. Leave the secret unset to ship the
          # built-in engine only. See README, "Chatbot".
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -f public/CNAME ]; then export BASE_PATH=/; else export BASE_PATH=/midsouthlunar/; fi
          echo "BASE_PATH=$BASE_PATH"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
