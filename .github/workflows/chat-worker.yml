name: Deploy Yang Yang chat service (Cloudflare Worker)

# Deploys server/worker.mjs to Cloudflare Workers whenever the chat code or the
# website data it is grounded on changes. Does nothing until the repository has
# these secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (Workers & Pages overview)
#   GEMINI_API_KEY         Google AI Studio key; pushed to the Worker as a secret
# Then set the repo Variable CHAT_API_URL to the Worker's /api/chat URL so the
# GitHub Pages build turns on live mode.

on:
  push:
    branches: [main]
    paths:
      - server/**
      - src/data/**
      - src/i18n/**
      - wrangler.jsonc
      - .github/workflows/chat-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Presence only; values are never printed.
          for name in CLOUDFLARE_API_TOKEN:$TOKEN CLOUDFLARE_ACCOUNT_ID:$ACCOUNT GEMINI_API_KEY:$GEMINI; do
            key=${name%%:*}; val=${name#*:}
            if [ -n "$val" ]; then echo "::notice::secret $key is set"; else echo "::notice::secret $key is NOT set"; fi
          done
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Worker deploy. Yang Yang stays in built-in mode."
          fi

      - name: Deploy Worker
        if: steps.cf.outputs.configured == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Pushed to the Worker as an encrypted secret; never printed or built into the site.
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Probe Gemini (status code and error message only, never the key)
        if: steps.cf.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODEL=$(node -e "const j=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(/\"GEMINI_MODEL\":\s*\"([^\"]+)\"/.exec(j)[1])")
          echo "model: $MODEL"
          code=$(curl -sS -o /tmp/gen.json -w '%{http_code}' -X POST "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent" -H "x-goog-api-key: $KEY" -H 'Content-Type: application/json' -d '{"contents":[{"role":"user","parts":[{"text":"Say hi in one word."}]}]}')
          echo "generateContent HTTP $code"
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/gen.json','utf8'));console.log(j.error?('error: '+j.error.status+' '+j.error.message.slice(0,300)):('ok: '+JSON.stringify(j.candidates?.[0]?.content?.parts?.[0]?.text)))"
          # Time each candidate model with a realistic grounded prompt (same size as the service sends).
          node -e "
            const fs=require('fs');const j=fs.readFileSync('wrangler.jsonc','utf8');
            const primary=/\"GEMINI_MODEL\":\s*\"([^\"]+)\"/.exec(j)[1];const fb=(/\"GEMINI_FALLBACK_MODELS\":\s*\"([^\"]+)\"/.exec(j)||[])[1]||'';
            fs.writeFileSync('/tmp/models.txt',[primary,...fb.split(',').map(s=>s.trim()).filter(Boolean)].join('\n'))"
          GROUND=$(node -e "import('./server/chat-service.mjs').then(({websiteGrounding,trimGrounding})=>process.stdout.write(JSON.stringify(trimGrounding(websiteGrounding('en'),'en'))))")
          node -e "const g=process.argv[1];require('fs').writeFileSync('/tmp/req.json',JSON.stringify({systemInstruction:{parts:[{text:'You are Yang Yang. Answer briefly from this JSON: '+g}]},contents:[{role:'user',parts:[{text:'What is the legend of Nian?'}]}],generationConfig:{temperature:0.3,maxOutputTokens:1024}}))" "$GROUND"
          echo "request bytes: $(wc -c < /tmp/req.json)"
          while read -r m; do
            start=$(date +%s.%N)
            code=$(curl -sS -m 60 -o /tmp/m.json -w '%{http_code}' -X POST "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" -H "x-goog-api-key: $KEY" -H 'Content-Type: application/json' --data-binary @/tmp/req.json)
            secs=$(echo "$(date +%s.%N) - $start" | bc)
            msg=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/m.json','utf8'));console.log(j.error?('error '+j.error.status):('ok, '+(j.usageMetadata?.promptTokenCount||'?')+' prompt tokens, '+(j.usageMetadata?.thoughtsTokenCount||0)+' thinking tokens, '+String(j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'').length+' chars'))" 2>/dev/null || echo unparsable)
            echo "timing: $m HTTP $code ${secs}s $msg"
          done < /tmp/models.txt
          code=$(curl -sS -o /tmp/models.json -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100" -H "x-goog-api-key: $KEY")
          echo "models list HTTP $code"
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/models.json','utf8'));console.log(j.error?('error: '+j.error.status+' '+j.error.message.slice(0,300)):(j.models||[]).map(m=>m.name.replace('models/','')).filter(n=>/flash/.test(n)).join(', '))"

      - name: Smoke test
        if: steps.cf.outputs.configured == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker URL: $URL"
          status=$(curl -sS "$URL/api/chat/status")
          echo "status: $status"
          [ "$status" = '{"enabled":true}' ] || { echo "::warning::Worker deployed but GEMINI_API_KEY is empty; live mode is off."; }
          echo "Set repository Variable CHAT_API_URL=$URL/api/chat and re-run the Pages workflow." >> "$GITHUB_STEP_SUMMARY"
