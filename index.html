    <script>
      // GitHub Pages SPA redirect: 404.html encodes the path in the query string.
      (function () {
        var q = window.location.search
        if (q.indexOf('?/') === 0) {
          var path = q.slice(2).split('&')[0].replace(/~and~/g, '&')
          window.history.replaceState(null, '', window.location.pathname.replace(/\/$/, '') + '/' + path + window.location.hash)
        }
