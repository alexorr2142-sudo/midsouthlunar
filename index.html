    <title>Mid-South Lunar New Year Festival</title>
    <script>
      // GitHub Pages SPA redirect: 404.html encodes the original path and query
      // as ?/path&query (with & inside the query written as ~and~). Restore it.
      (function () {
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, '', l.pathname.replace(/\/$/, '') + decoded + l.hash)
        }
      })()
    </script>

    <div id="root"></div>

  </body>
